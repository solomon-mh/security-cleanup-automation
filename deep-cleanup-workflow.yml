name: Deep Security Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without opening a pull request'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      branch_prefix:
        description: 'Branch prefix used when opening the cleanup PR'
        required: true
        default: 'security-cleanup'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download cleanup script
        env:
          CLEANUP_SCRIPT_URL: https://raw.githubusercontent.com/solomon-mh/security-cleanup-automation/main/cleanup.py
        run: |
          curl -fsSL "$CLEANUP_SCRIPT_URL" -o "${RUNNER_TEMP}/cleanup.py"
          chmod +x "${RUNNER_TEMP}/cleanup.py"

      - name: Run cleanup
        run: |
          (
            cd "${RUNNER_TEMP}"
            python3 ./cleanup.py "${GITHUB_WORKSPACE}"
          ) | tee "${RUNNER_TEMP}/cleanup_output.log"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Create cleanup report
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          {
            echo "# Security Cleanup Report"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Run date: $(date -u)"
            echo "- Dry run: ${{ github.event.inputs.dry_run }}"
            echo
            echo "## Files changed"
            git diff --name-only | sed 's/^/- /'
            echo
            echo "## Diff summary"
            git diff --stat
          } > "${RUNNER_TEMP}/cleanup_report.md"

          cat "${RUNNER_TEMP}/cleanup_report.md"

      - name: Open cleanup pull request
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.dry_run == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'security: remove malicious code from supply chain attack'
          branch: ${{ github.event.inputs.branch_prefix }}-${{ github.run_number }}
          title: 'Security cleanup: remove malicious code'
          body-path: ${{ runner.temp }}/cleanup_report.md
          delete-branch: true

      - name: Dry-run summary
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.dry_run == 'true'
        run: echo "Dry run complete. Review the diff summary above before re-running with dry_run=false."

      - name: Upload cleanup artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-cleanup-artifacts
          path: |
            ${{ runner.temp }}/cleanup_output.log
            ${{ runner.temp }}/cleanup_report.md
            ${{ runner.temp }}/cleanup_report.json
