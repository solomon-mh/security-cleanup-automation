name: Purge supply-chain malware from history

# DESTRUCTIVE. A real run rewrites every commit in each target repo with
# git-filter-repo and force-pushes all branches and tags. Existing clones,
# forks and open PRs will break. Read HISTORY-PURGE.md before dry_run=false.

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'GitHub user/org that owns the repos'
        required: true
        default: 'solomon-mh'
      repos:
        description: 'Comma-separated repo names to purge'
        required: true
        default: 'traceOn,fetanfews,truLiving,jiByte,regalcanvas,mealer,receipt-ocr,solomon-muhye,Docledge,fetanfews-server,solomon-mh,traceon-loadrunner'
      dry_run:
        description: 'true = analyse only (no rewrite, no push)'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
      confirm:
        description: 'Type REWRITE-HISTORY to allow the force-push (only used when dry_run=false)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: history-purge
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Real run needs explicit confirmation
        if: ${{ inputs.dry_run == 'false' && inputs.confirm != 'REWRITE-HISTORY' }}
        run: |
          echo "::error::A real run (dry_run=false) requires confirm = REWRITE-HISTORY"
          exit 1
      - name: Build repo list
        id: list
        env:
          R: ${{ inputs.repos }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          items = [x.strip() for x in os.environ["R"].replace("\n", ",").split(",") if x.strip()]
          assert items, "no repos supplied"
          print("repos=" + json.dumps(items))
          PY
          echo "gate passed (dry_run=${{ inputs.dry_run }})"
          cat "$GITHUB_OUTPUT"

  purge:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.gate.outputs.repos) }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install git-filter-repo and fetch scrubber
        run: |
          set -euo pipefail
          python -m pip install --quiet git-filter-repo
          mkdir -p "$RUNNER_TEMP/purge"
          base='https://raw.githubusercontent.com/solomon-mh/security-cleanup-automation/main'
          curl -fsSL -o "$RUNNER_TEMP/purge/history_purge.py" "$base/history_purge.py"
          curl -fsSL -o "$RUNNER_TEMP/purge/cleanup.py" "$base/cleanup.py"
          python "$RUNNER_TEMP/purge/history_purge.py" --self-check

      - name: Checkout target repo (full history)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.owner }}/${{ matrix.repo }}
          token: ${{ secrets.CLEANUP_TOKEN }}
          fetch-depth: 0
          path: target

      - name: Scan and record indicators (before)
        working-directory: target
        run: |
          set +e
          RX='0xa322E5f3|A10-\*?4650|withRpcEndpoints|eth_getTra|eth_blockN|eth_getBlo|rpcCall|rpcBatch|temp_auto_push|temp_interactive_push|branch_structure\.json'
          python "$RUNNER_TEMP/purge/cleanup.py" --scan . | tee ../scan-before.log
          {
            echo "# ${{ matrix.repo }} - indicators in history (before)"
            echo
            git rev-list --all | xargs -r git grep -InE "$RX" | head -n 300
            echo "(list truncated at 300 lines if longer)"
          } > ../report-before.md

          # Dump the offending files from the current tip, control chars made
          # visible (cat -v), so the payload and its \r padding can be reviewed.
          mkdir -p ../payload-samples
          git grep -lIE "$RX" HEAD -- 2>/dev/null | sed 's/^HEAD://' | sort -u | while read -r f; do
            [ -z "$f" ] && continue
            out="../payload-samples/$(echo "$f" | tr '/' '_').cat-v.txt"
            {
              echo "=== $f  (repo ${{ matrix.repo }}, HEAD) ==="
              git show "HEAD:$f" | cat -v | head -c 60000
              echo
              echo "=== (truncated at 60000 chars) ==="
            } > "$out"
          done
          ls -la ../payload-samples || true

      - name: Create recovery bundle
        working-directory: target
        run: git bundle create ../backup-${{ matrix.repo }}.bundle --all

      - name: Upload recovery bundle + pre-scan
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ matrix.repo }}
          path: |
            backup-${{ matrix.repo }}.bundle
            scan-before.log
            report-before.md
            payload-samples/
          retention-days: 90
          if-no-files-found: warn

      - name: Build blob-callback
        run: |
          cat > "$RUNNER_TEMP/purge/callback.py" <<PY
          import sys
          sys.path.insert(0, "$RUNNER_TEMP/purge")
          from history_purge import scrub
          blob.data = scrub(blob.data)
          PY

      - name: Rewrite history - DRY RUN (analysis only)
        if: ${{ inputs.dry_run == 'true' }}
        working-directory: target
        run: |
          set -euo pipefail
          git filter-repo --force --dry-run \
            --invert-paths \
            --path-glob 'temp_auto_push.*' \
            --path-glob '*/temp_auto_push.*' \
            --path-glob 'temp_interactive_push.*' \
            --path-glob '*/temp_interactive_push.*' \
            --path branch_structure.json \
            --path-glob '*/branch_structure.json' \
            --path-glob '*fa-solid-400.woff2' \
            --blob-callback "$(cat "$RUNNER_TEMP/purge/callback.py")"
          echo
          echo "DRY RUN complete - nothing was pushed."
          echo "git-filter-repo wrote its analysis to target/.git/filter-repo/"
          [ -f .git/filter-repo/fast-export.filtered ] && \
            echo "filtered stream size: $(wc -c < .git/filter-repo/fast-export.filtered) bytes" || true

      - name: Rewrite history and FORCE-PUSH
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: target
        env:
          TOKEN: ${{ secrets.CLEANUP_TOKEN }}
        run: |
          set -euo pipefail

          git config user.email "security-cleanup-bot@users.noreply.github.com"
          git config user.name "security-cleanup-bot"

          git filter-repo --force \
            --invert-paths \
            --path-glob 'temp_auto_push.*' \
            --path-glob '*/temp_auto_push.*' \
            --path-glob 'temp_interactive_push.*' \
            --path-glob '*/temp_interactive_push.*' \
            --path branch_structure.json \
            --path-glob '*/branch_structure.json' \
            --path-glob '*fa-solid-400.woff2' \
            --blob-callback "$(cat "$RUNNER_TEMP/purge/callback.py")"

          echo "::group::Verify - no indicator survives anywhere in history"
          fail=0
          while read -r c; do
            if git grep -qIE '0xa322E5f3|A10-\*?4650|withRpcEndpoints|eth_getTra|eth_blockN|eth_getBlo|rpcCall|rpcBatch|temp_auto_push|temp_interactive_push|branch_structure\.json' "$c" -- ; then
              echo "::error::indicator survived in commit $c of ${{ matrix.repo }}"
              fail=1
            fi
          done < <(git rev-list --all)
          echo "::endgroup::"
          if [ "$fail" -ne 0 ]; then
            echo "::error::NOT pushing ${{ matrix.repo }} - rewrite left indicators behind"
            exit 1
          fi

          # filter-repo removes 'origin'; re-add it with the token and drop any
          # stale auth header left by actions/checkout.
          git config --unset-all http."https://github.com/".extraheader 2>/dev/null || true
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ inputs.owner }}/${{ matrix.repo }}.git"

          git push --force --prune origin 'refs/heads/*:refs/heads/*'
          git push --force origin 'refs/tags/*:refs/tags/*'
          echo "::notice::rewritten history force-pushed for ${{ matrix.repo }}"

      - name: Scan again (after)
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: target
        run: |
          set +e
          RX='0xa322E5f3|A10-\*?4650|withRpcEndpoints|eth_getTra|eth_blockN|eth_getBlo|rpcCall|rpcBatch|temp_auto_push|temp_interactive_push|branch_structure\.json'
          {
            echo "=== working tree scan ==="
            python "$RUNNER_TEMP/purge/cleanup.py" --scan .
            echo
            echo "=== full history indicator grep (must be empty) ==="
            git rev-list --all | xargs -r git grep -InE "$RX" | head -n 50 || echo "clean"
          } | tee ../scan-after.log

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.repo }}
          path: |
            scan-after.log
          retention-days: 90
          if-no-files-found: ignore

  summary:
    needs: purge
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Generate summary
        run: |
          {
            echo "# History purge summary"
            echo
            echo "run: $(date -u)   dry_run=${{ inputs.dry_run }}   owner=${{ inputs.owner }}"
            echo "repos: ${{ inputs.repos }}"
            echo
            find reports -name 'scan-*.log' | sort | while read -r f; do
              echo "## $f"
              echo '```'
              cat "$f"
              echo '```'
            done
          } > summary.md
          cat summary.md

      - name: Publish summary
        uses: actions/upload-artifact@v4
        with:
          name: _summary
          path: summary.md
          retention-days: 90
