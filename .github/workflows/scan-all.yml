name: Scan all repos for malware

# READ-ONLY. Lists every repo the CLEANUP_TOKEN can see, clones each one,
# greps for the supply-chain-attack indicators, and prints a table of which
# repos are infected and which are clean. Changes nothing, pushes nothing.

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'User/org to scan (leave blank = whoever owns the token)'
        required: false
        default: ''
      scan_history:
        description: 'Also scan full commit history (slower, but catches malware that was "fixed" in a later commit)'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: List repositories and scan each one
        env:
          GH_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
          OWNER: ${{ inputs.owner }}
          SCAN_HISTORY: ${{ inputs.scan_history }}
        run: |
          set -uo pipefail

          # Distinctive strings from the documented attack (POSIX ERE, no quotes).
          RX='A10-\*?4650|0xa322E5f3|eth_getTra|eth_blockN|eth_getBlo|withRpcEndpoints|rpcCall|rpcBatch|spawn\(.{0,6}node'

          # --- 1. list repositories ------------------------------------------
          : > repos.txt
          page=1
          while : ; do
            if [ -n "${OWNER}" ]; then
              url="https://api.github.com/users/${OWNER}/repos?per_page=100&type=all&page=${page}"
            else
              url="https://api.github.com/user/repos?per_page=100&affiliation=owner&page=${page}"
            fi
            resp=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
                              -H "Accept: application/vnd.github+json" \
                              -H "X-GitHub-Api-Version: 2022-11-28" "$url") || {
              echo "::error::GitHub API call failed (page ${page}). Check the CLEANUP_TOKEN."
              break
            }
            names=$(printf '%s' "$resp" | jq -r '.[].full_name' 2>/dev/null || true)
            [ -z "$names" ] && break
            printf '%s\n' "$names" >> repos.txt
            n=$(printf '%s\n' "$names" | grep -c .)
            [ "$n" -lt 100 ] && break
            page=$((page + 1))
          done

          total=$(grep -c . repos.txt || true)
          echo "Repositories visible to the token: ${total}"
          if [ "${total}" -eq 0 ]; then
            echo "::error::No repositories found. Either the token has no repo access, or OWNER is wrong."
            exit 1
          fi
          echo

          # --- 2. scan each repo -------------------------------------------
          : > report.txt
          : > details.txt
          printf '%-46s | %-8s | %s\n' "REPO" "STATUS" "FIRST HIT (count)" | tee -a report.txt
          printf '%s\n' "-------------------------------------------------------------------------------" | tee -a report.txt

          while read -r full; do
            [ -z "$full" ] && continue
            rm -rf work work.git

            if [ "${SCAN_HISTORY}" = "true" ]; then
              if ! git clone --quiet --mirror \
                   "https://x-access-token:${GH_TOKEN}@github.com/${full}.git" work.git 2>/dev/null; then
                printf '%-46s | %-8s | %s\n' "$full" "ERROR" "clone failed" | tee -a report.txt
                continue
              fi
              hits=$(cd work.git && git rev-list --all 2>/dev/null \
                     | xargs -r git grep -lIE "$RX" 2>/dev/null | sort -u | head -n 25)
              rm -rf work.git
            else
              if ! git clone --quiet --depth 1 \
                   "https://x-access-token:${GH_TOKEN}@github.com/${full}.git" work 2>/dev/null; then
                printf '%-46s | %-8s | %s\n' "$full" "ERROR" "clone failed" | tee -a report.txt
                continue
              fi
              hits=$(grep -rlIE "$RX" --exclude-dir=.git work 2>/dev/null | sed 's|^work/||' | head -n 25)
              rm -rf work
            fi

            if [ -n "$hits" ]; then
              c=$(printf '%s\n' "$hits" | grep -c .)
              first=$(printf '%s\n' "$hits" | head -n1)
              printf '%-46s | %-8s | %s\n' "$full" "INFECTED" "${first} (+$((c-1)) more)" | tee -a report.txt
              {
                echo "### ${full}"
                printf '%s\n' "$hits"
                echo
              } >> details.txt
            else
              printf '%-46s | %-8s | %s\n' "$full" "clean" "" | tee -a report.txt
            fi
          done < repos.txt

          echo
          echo "===================== SUMMARY ====================="
          infected=$(grep -c ' | INFECTED | ' report.txt || true)
          errors=$(grep -c ' | ERROR' report.txt || true)
          echo "scanned : ${total}"
          echo "infected: ${infected}"
          echo "errors  : ${errors}"
          echo
          echo "----- infected file detail -----"
          cat details.txt 2>/dev/null || echo "(none)"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malware-scan-report
          path: |
            report.txt
            details.txt
            repos.txt
          if-no-files-found: warn
          retention-days: 90
